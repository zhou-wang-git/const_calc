workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Codemagic_iOS_Build
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: false
    environment:
      ios_signing:
        provisioning_profiles:
          - numforlife_appstore
        certificates:
          - numforlife_distribution
      vars:
        APP_STORE_APPLE_ID: 6746473060
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--apple-id 6746473060"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up debug log
        script: |
          set -e
          set -x
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Generate app icons
        script: |
          dart run flutter_launcher_icons
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter analyze
        script: |
          flutter analyze || echo "Flutter analyze reported issues; continuing release build."
        ignore_failure: true
      - name: Flutter test
        script: |
          flutter test || echo "Flutter test reported issues; continuing release build."
        ignore_failure: true
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Flutter build ipa
        script: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          BUILD_NAME=${APP_VERSION%%+*}
          BUILD_NUMBER=${APP_VERSION##*+}
          echo "Building iOS version $BUILD_NAME ($BUILD_NUMBER)"
          flutter build ipa --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - 184232456@qq.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
